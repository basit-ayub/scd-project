services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodevault-app
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=${PORT}
    networks:
      - nodevault-net
    ports:
      - "3000:3000"
    tty: true
    stdin_open: true
    command: sh -c "node db/importVault.js && node main.js"
    
  mongodb:
    image: mongo:6
    container_name: nodevault-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - nodevault-net
    ports:
      - "27017:27017"

networks:
  nodevault-net:
    driver: bridge

volumes:
  mongo-data:
